[workspace]
resolver = "2"
members = ["sillage-reader", "sillage-common", "sillage-writer", "sillage-probe"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"

[workspace.dependencies]
tokio = { version = "1", default-features = false }
tonic = { version = "0.14", features = ["tls-ring"] }
prost = "0.14"
yellowstone-grpc-proto = "12.4"
roaring = "0.11"
rmp-serde = "1.3"
zstd = "0.13"
aws-sdk-s3 = "1"
aws-config = "1"
aws-credential-types = "1"
aws-smithy-mocks = "0.2"
aws-smithy-types = "1"
axum = "0.8"
config = { version = "0.15", features = ["toml"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tokio-util = { version = "0.7", features = ["rt"] }
tempfile = "3"
tokio-stream = "0.1"
futures = "0.3"
metrics = "0.24"
metrics-exporter-prometheus = "0.16"
yellowstone-grpc-client = "13.1.0"
rustix = { version = "1", features = ["fs"] }
filetime = "0.2"
bs58 = "0.5"
clap = { version = "4", features = ["derive"] }
