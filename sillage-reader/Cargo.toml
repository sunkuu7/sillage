[package]
name = "sillage-reader"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Replays recorded Solana Geyser chunks over the Yellowstone gRPC API."

[dependencies]
tokio = { workspace = true, features = ["full"] }
tonic = { workspace = true }
prost = { workspace = true }
yellowstone-grpc-proto = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
sillage-common = { path = "../sillage-common", version = "0.1.0" }
tokio-stream = { workspace = true }
aws-sdk-s3 = { workspace = true }
aws-config = { workspace = true }
aws-credential-types = { workspace = true }
axum = { workspace = true }
serde_json = { workspace = true }
zstd = { workspace = true }
futures = { workspace = true }
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
bs58 = { workspace = true }
roaring = { workspace = true }
rmp-serde = { workspace = true }

[dev-dependencies]
aws-smithy-mocks = { workspace = true }
aws-smithy-types = { workspace = true }
tempfile = { workspace = true }
filetime = { workspace = true }
# pacing/replay tests drive the clock with tokio's paused-time helpers; without
# this the crate only compiles under `--workspace`, borrowing the feature from
# sillage-writer's dev-dependencies.
tokio = { workspace = true, features = ["test-util"] }
